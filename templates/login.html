<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>
<body class="px-12 py-4">
    <form method="post" action="/" class="w-96 border shadow-xl mx-auto mt-7 p-4">
        <h2 class="mb-4 text-xl font-bold">Log In</h2>
        <div class="flex mb-4">
            <label>
                Username:
                <input type="text" name="username" minlength="3" maxlength="30" required class="p-1 border rounded">
            </label>
        </div>
        <div class="mb-4">
            <label>
                Recommendation algorithm:
                <select name="algorithm" id="algorithm" class="p-1 border rounded" onchange="updateAlgorithmDescription()">
                    <option value="balanced" selected>Balanced (personalized)</option>
                    <option value="tunnel_vision">Tunnel vision (personalized)</option>
                    <option value="top_n">Top rated</option>
                    <option value="most_rated">Most reviewed</option>
                    <option value="random">Random</option>
                    <option value="baseline">Baseline (Surprise)</option>
                    <option value="svd">SVD (Surprise)</option>
                    <option value="ease">EASE</option>
                    <option value="two_towers">Two towers (neural network)</option>
                    <option value="big_tower">One big tower (neural network)</option>
                    <option value="ensemble">Ensemble (LightGBM)</option>
                    <option value="average">Model average</option>
                    <option value="cascade_baseline">Cascade baseline</option>
                    <option value="cascade_svd">Cascade SVD</option>
                    <option value="cascade_ease">Cascade EASE</option>
                    <option value="cascade_two_towers">Cascade two towers</option>
                    <option value="cascade_big_tower">Cascade big tower</option>
                    <option value="cascade_ensemble">Cascade ensemble</option>
                </select>
            </label>
            <p id="algorithm-description" class="text-xs text-neutral-500 mt-1"></p>
        </div>
        <div class="flex justify-end">
            <button type="submit" class="border bg-teal-500 hover:bg-teal-700 text-white text-lg py-2 px-4 ml-auto">
                Log In
            </button>
        </div>
    </form>
    <script>
        const algorithmDescriptions = {
            balanced: "Personalized picks based on your own genre and artist ratings on RYM, weighted against how well-reviewed each album is overall.",
            tunnel_vision: "A narrower, more intense version of the personalized pick: albums must match BOTH a genre and an artist you've rated highly. Falls back to generally popular albums if there aren't enough matches.",
            top_n: "The highest community-rated albums on RYM (with at least 5 reviews) that you haven't rated or seen yet.",
            most_rated: "The most-reviewed albums on RYM that you haven't rated or seen yet.",
            random: "A random sample of albums you haven't rated or seen yet.",
            baseline: "The albums with the highest bias in a BaselineOnly model (overall average + reviewer bias + album bias): the same for everyone. If the model doesn't know you yet, the most reviewed albums.",
            svd: "Predicts your rating from latent user and album factors learned by matrix factorization (SVD). If the model doesn't know you yet, the most reviewed albums.",
            ease: "Albums that tend to be reviewed together with the ones you reviewed (EASE, a linear album-to-album model). If the model doesn't know you yet, the most reviewed albums.",
            two_towers: "A neural network turns you and each album into vectors and recommends the albums closest to you, trained to guess what you'll review next. If the model doesn't know you yet, the most reviewed albums.",
            big_tower: "A neural network estimates the chance that you review each album from you, the album, its artist, primary genre, language and release year. If the model doesn't know you yet, the most reviewed albums.",
            ensemble: "Combines SVD, EASE, two towers and big tower: a LightGBM model reorders the albums each one proposes, using their scores and your affinity with each album's artist, genre and language.",
            average: "Combines SVD, EASE, two towers and big tower: orders the albums each one proposes by the average of their scores.",
            cascade_baseline: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if the model doesn't know you yet (fewer than 5 reviews when it was trained), tunnel vision; otherwise, Baseline.",
            cascade_svd: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if the model doesn't know you yet (fewer than 5 reviews when it was trained), tunnel vision; otherwise, SVD.",
            cascade_ease: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if the model doesn't know you yet (fewer than 5 reviews when it was trained), tunnel vision; otherwise, EASE.",
            cascade_two_towers: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if the model doesn't know you yet (fewer than 5 reviews when it was trained), tunnel vision; otherwise, two towers.",
            cascade_big_tower: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if the model doesn't know you yet (fewer than 5 reviews when it was trained), tunnel vision; otherwise, the big tower.",
            cascade_ensemble: "Picks the algorithm by how well it knows you: with up to 2 reviews, the top rated albums; if no model knows you yet (fewer than 5 reviews when they were trained), tunnel vision; otherwise, the ensemble."
        };

        function updateAlgorithmDescription() {
            const select = document.getElementById('algorithm');
            document.getElementById('algorithm-description').textContent = algorithmDescriptions[select.value] || '';
        }

        updateAlgorithmDescription();
    </script>
</body>
</html>
